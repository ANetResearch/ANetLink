name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"   # K207 A3: the distributed runtime is pure Go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: tests
        run: go test ./...
      - name: demo boots
        run: go run ./cmd/anetlinkd --demo

  realworld:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: bring up real services (mosquitto / modbus / Home Assistant)
        run: ./test/realworld/up.sh
      - name: realworld tests against real services
        run: ./test/realworld/run.sh
      - name: teardown
        if: always()
        run: ./test/realworld/down.sh
