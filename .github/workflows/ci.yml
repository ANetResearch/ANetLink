name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"   # K207 A3: the distributed runtime is pure Go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: vet the tag-guarded files too
        # Code behind a build tag is invisible to a default vet, so a broken
        # realworld or camera test would sit undetected until someone ran it.
        run: |
          go vet -tags realworld ./...
          go vet -tags onvif,hikvision,dahua ./...
          go vet -tags realworld,onvif,hikvision,dahua ./...
      - name: tests
        run: go test ./...
      - name: demo boots
        run: go run ./cmd/anetlinkd --demo

  realworld:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: bring up real services (mosquitto / modbus / Home Assistant)
        run: ./test/realworld/up.sh
      - name: realworld tests against real services
        run: ./test/realworld/run.sh
      - name: teardown
        if: always()
        run: ./test/realworld/down.sh

  # The opt-in adapters (K212 D57) are absent from every job above by design:
  # they are not compiled into a default build. Without this job the camera
  # and vendor adapters would never be built, vetted or tested in CI at all.
  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tags: ["onvif", "hikvision", "dahua", "adap", "onvif,hikvision,dahua,adap"]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet with ${{ matrix.tags }}
        run: go vet -tags "${{ matrix.tags }}" ./...
      - name: tests with ${{ matrix.tags }}
        run: go test -tags "${{ matrix.tags }}" ./...
      - name: boot with ${{ matrix.tags }}
        run: go run -tags "${{ matrix.tags }}" ./cmd/anetlinkd --demo

  unplug:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tags: ["no_modbus", "no_mqtt", "no_ha", "no_sim", "no_opcua", "no_bacnet", "no_can", "no_ble", "no_zigbee", "no_btmesh", "no_thread", "no_btmesh,no_zigbee", "no_modbus,no_mqtt,no_ha,no_sim,no_opcua,no_bacnet,no_can,no_ble,no_zigbee,no_btmesh,no_thread"]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build without ${{ matrix.tags }}
        run: go build -tags "${{ matrix.tags }}" ./...
      - name: boot without ${{ matrix.tags }}
        run: go run -tags "${{ matrix.tags }}" ./cmd/anetlinkd --demo

  # Every M-AL mutation (LEC §7.3) must turn the tests it names red; one
  # that survives means a security rule lost its test.
  mutations:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: each mutation is caught
        run: ./test/mutations/run.sh

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests under the race detector
        env:
          CGO_ENABLED: "1"   # -race needs cgo; runners ship gcc
        run: go test -race ./...
      - name: race with the opt-in adapters
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags onvif,hikvision,dahua ./...
